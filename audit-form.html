<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Audit gratuit de votre site en 30 secondes - Mahdi Design</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap">
<link rel="stylesheet" href="assets/atoms.css?v=5">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.solo{border:1px solid var(--line);border-radius:var(--radius-cards);padding:48px 40px;max-width:500px;margin:24px;text-align:center}
.solo h1{font-size:30px;margin-bottom:12px}
.solo p{color:var(--ink-dim);font-size:14px;margin-bottom:22px}
.solo .tiny{font-size:12px;color:var(--ink-faint);margin-top:14px}
</style>
</head>
<body>
<div class="solo">
<div class="mosaic" aria-hidden="true" style="margin-bottom:28px"></div>
<h1>Votre site, <span class="gold">scanné en 30 secondes.</span></h1>
<p>Vitesse, mobile, sécurité, visibilité Google. Rapport chiffré, sans engagement, livré par email.</p>
<form name="audit-gratuit" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/merci-audit.html">
  <input type="hidden" name="form-name" value="audit-gratuit" />
  <p style="display:none"><label>Ne pas remplir: <input name="bot-field"/></label></p>
  <div style="margin-bottom:14px"><input class="in" type="url" name="site" placeholder="https://votre-site.fr" required /></div>
  <div style="margin-bottom:16px"><input class="in" type="email" name="email" placeholder="votre@email.fr" required /></div>
  <button class="btn btn-cream" style="width:100%" type="submit">Recevoir mon audit gratuit →</button>
</form>
<p class="tiny">Aucune inscription. Vous voyez vous-même avant de me croire.</p>
<p class="mt" style="font-size:13px"><a class="ghost" href="https://mahdi-design.com">← Retour au portfolio</a></p>
</div>
<script src="assets/site.js?v=5"></script>
</body>
</html>
